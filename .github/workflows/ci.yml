name: CI (A1_FR2)

on:
  push:
    branches:
      - "A1_FR2-Sistema-turi-įgyvendinti-naujos-prekės-sukūrimo-funkcionalumą"
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Gradle, Java 21) - build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VGTU-Aventory-Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build backend (skip tests)
        run: ./gradlew clean build -x test --no-daemon

      - name: Run backend tests
        run: ./gradlew test --no-daemon

  frontend:
    name: Frontend (Next.js) - lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VGTU-Aventory-Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: VGTU-Aventory-Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build