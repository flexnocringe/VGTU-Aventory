name: CI - Feature Branch Build and Test Antras Bandymas

on:
  push:
    branches:
      - 'A4_NR1-Vartotojas-gali-peržiūrėti-visų-savo-sukurtų-renginių-sąrašą'
  pull_request:
    branches:
      - 'A4_NR1-Vartotojas-gali-peržiūrėti-visų-savo-sukurtų-renginių-sąrašą'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./VGTU-Aventory-Backend/gradlew

      - name: Build without tests
        run: ./gradlew build -x test
        working-directory: ./VGTU-Aventory-Backend

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./VGTU-Aventory-Backend/build/libs/