name: CI - Feature Branch Build and Test

on:
  push:
    branches:
      - 'A4_NR1-Vartotojas-gali-peržiūrėti-visų-savo-sukurtų-renginių-sąrašą'
  pull_request:
    branches:
      - 'A4_NR1-Vartotojas-gali-peržiūrėti-visų-savo-sukurtų-renginių-sąrašą'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./VGTU-Aventory-Backend/gradlew

      - name: Build with Gradle
        run: ./gradlew clean build
        working-directory: ./VGTU-Aventory-Backend

      - name: Run tests
        run: ./gradlew test
        working-directory: ./VGTU-Aventory-Backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./VGTU-Aventory-Backend/build/test-results/test/

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./VGTU-Aventory-Backend/build/libs/
