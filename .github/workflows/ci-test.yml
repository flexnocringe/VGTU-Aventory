name: CI pipeline Test (A1_FR2 backend)

on:
  push:
    branches:
      - "A1_FR2-Sistema-turi-įgyvendinti-naujos-prekės-sukūrimo-funkcionalumą"
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend - run unit tests + generate reports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VGTU-Aventory-Backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      # 1) TESTAS CI: visi JUnit testai (pvz. ProductControllerTests) praeina
      - name: Run unit tests
        run: ./gradlew test --no-daemon

