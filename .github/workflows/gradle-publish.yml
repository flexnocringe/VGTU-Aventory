name: Feature Branch CI

on:
  push:
    branches:
      - 'A2_FR1-Sistema-turi-automatiškai-sumažinti-produkto-likutį-inventoriuje-po-sėkmingo-pardavimo-registravimo'
  pull_request:
    branches:
      - 'A2_FR1-Sistema-turi-automatiškai-sumažinti-produkto-likutį-inventoriuje-po-sėkmingo-pardavimo-registravimo'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Backend
        run: ./gradlew build

      - name: Run Backend Unit Tests
        run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    needs: backend  # ensures backend build passes first
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./VGTU-Aventory-Frontend

      - name: Build Frontend
        run: npm run build
        working-directory: ./VGTU-Aventory-Frontend
