name: Feature Branch CI

on:
  push:
    branches:
      - 'A2_FR1-Sistema-turi-automatiškai-sumažinti-produkto-likutį-inventoriuje-po-sėkmingo-pardavimo-registravimo'
  pull_request:
    branches:
      - 'A2_FR1-Sistema-turi-automatiškai-sumažinti-produkto-likutį-inventoriuje-po-sėkmingo-pardavimo-registravimo'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Set up Java 21 to match Gradle build
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Ensure Gradle wrapper is executable
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./VGTU-Aventory-Backend/gradlew

      # Build backend
      - name: Build Backend
        run: ./gradlew build -x test
        working-directory: ./VGTU-Aventory-Backend

      - name: Run Backend Unit Tests
        run: ./gradlew test \
          -Dspring.datasource.url=jdbc:h2:mem:testdb \
          -Dspring.datasource.driver-class-name=org.h2.Driver \
          -Dspring.datasource.username=sa \
          -Dspring.datasource.password= \
          -Dspring.jpa.database-platform=org.hibernate.dialect.H2Dialect \
          -Dspring.jpa.hibernate.ddl-auto=create-drop
        working-directory: ./VGTU-Aventory-Backend

  frontend:
    runs-on: ubuntu-latest
    needs: backend  # ensures backend build passes first
    steps:
      # Checkout code again for frontend job
      - uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Install frontend dependencies
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./VGTU-Aventory-Frontend

      # Build frontend
      - name: Build Frontend
        run: npm run build
        working-directory: ./VGTU-Aventory-Frontend
