name: Basic CI

on:
  push:
    branches:
      - main
      - A1_FR1-Sistema-turi-leisti-vartotojui-filtruoti-prekes-pagal-kategorija
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./VGTU-Aventory-Backend/gradlew

      - name: Build backend
        working-directory: ./VGTU-Aventory-Backend
        run: ./gradlew build

      - name: Run tests
        working-directory: ./VGTU-Aventory-Backend
        run: ./gradlew test