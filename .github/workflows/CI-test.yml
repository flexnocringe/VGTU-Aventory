name: Test Pipeline

on:
  push:
    branches:
      - 'A2_FR1-Sistema-turi-automatiškai-sumažinti-produkto-likutį-inventoriuje-po-sėkmingo-pardavimo-registravimo'
  pull_request:
    branches:
      - 'A2_FR1-Sistema-turi-automatiškai-sumažinti-produkto-likutį-inventoriuje-po-sėkmingo-pardavimo-registravimo'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: chmod +x ./VGTU-Aventory-Backend/gradlew

      - name: Run Backend Tests (H2)
        run: ./gradlew test --console=plain
        working-directory: ./VGTU-Aventory-Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
          SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD:
          SPRING_JPA_DATABASE-PLATFORM: org.hibernate.dialect.H2Dialect
          SPRING_JPA_HIBERNATE_DDL-AUTO: create-drop

      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        with:
          name: backend-test-report
          path: ./VGTU-Aventory-Backend/build/reports/tests/test
