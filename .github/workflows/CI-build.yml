name: Build Pipeline

on:
  push:
    branches:
      - 'A2_FR1-Sistema-turi-automatiškai-sumažinti-produkto-likutį-inventoriuje-po-sėkmingo-pardavimo-registravimo'
  pull_request:
    branches:
      - 'A2_FR1-Sistema-turi-automatiškai-sumažinti-produkto-likutį-inventoriuje-po-sėkmingo-pardavimo-registravimo'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: chmod +x ./VGTU-Aventory-Backend/gradlew

      - name: Build Backend
        run: ./gradlew build -x test
        working-directory: ./VGTU-Aventory-Backend

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./VGTU-Aventory-Frontend

      - name: Build Frontend
        run: npm run build
        working-directory: ./VGTU-Aventory-Frontend
