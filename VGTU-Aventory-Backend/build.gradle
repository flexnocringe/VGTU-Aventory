plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.netflix.dgs.codegen' version '8.3.0'
    id 'pmd'
    id 'com.github.spotbugs' version '6.5.13'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'VGTU-Aventory'

// Static analysis setup for HW1 (member C); configs live in ../quality-hw1/analysis/static/config
def pmdVersion = '7.29.0'
def staticAnalysisConfig = '../quality-hw1/analysis/static/config'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    cpd
}

repositories {
    mavenCentral()
}

dependencies {

    // Source: https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation("com.google.code.gson:gson:2.13.2")

    // Source: https://mvnrepository.com/artifact/org.seleniumhq.selenium/selenium-java
    implementation("org.seleniumhq.selenium:selenium-java:4.41.0")

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webservices'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
    cpd "net.sourceforge.pmd:pmd-cli:${pmdVersion}"
    cpd "net.sourceforge.pmd:pmd-java:${pmdVersion}"
}

generateJava {
    schemaPaths = ["${projectDir}/src/main/resources/graphql-client"]
    packageName = 'org.example.vgtuaventory.codegen'
    generateClient = true
}

tasks.named('test') {
    useJUnitPlatform()
}

pmd {
    toolVersion = pmdVersion
    ruleSets = []
    ruleSetFiles = files("${staticAnalysisConfig}/pmd-ruleset.xml")
    ignoreFailures = true
}

tasks.named('pmdMain') {
    exclude '**/codegen/**'
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('pmdTest') {
    enabled = false
}

spotbugs {
    toolVersion = '4.10.5'
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
    excludeFilter = file("${staticAnalysisConfig}/spotbugs-exclude.xml")
    ignoreFailures = true
}

tasks.named('spotbugsMain') {
    reports {
        html {
            required = true
        }
        xml {
            required = true
        }
    }
}

tasks.named('spotbugsTest') {
    enabled = false
}

tasks.register('cpdMain', JavaExec) {
    group = 'verification'
    description = 'Finds copy-pasted code in main sources with PMD CPD.'
    def report = layout.buildDirectory.file('reports/cpd/main.xml')
    inputs.dir 'src/main/java'
    outputs.file report
    classpath = configurations.cpd
    mainClass = 'net.sourceforge.pmd.cli.PmdCli'
    args 'cpd',
            '--language', 'java',
            '--minimum-tokens', '50',
            '--dir', 'src/main/java',
            '--format', 'xml',
            '--report-file', report.get().asFile.path,
            '--no-fail-on-violation'
    doFirst {
        report.get().asFile.parentFile.mkdirs()
    }
}

tasks.register('staticAnalysis', Copy) {
    group = 'verification'
    description = 'Runs PMD, CPD and SpotBugs and copies the reports to quality-hw1/analysis/static.'
    dependsOn 'pmdMain', 'cpdMain', 'spotbugsMain'
    from(layout.buildDirectory.dir('reports')) {
        include 'pmd/**', 'cpd/**', 'spotbugs/**'
    }
    into '../quality-hw1/analysis/static'
}